blueprint:
  name: Aqara Zigbee Mini Switch (WXKG11LM)
  description: Aqara Zigbee Mini Switch (WXKG11LM)
  domain: automation
  input:
    switch:
      name: Switch
      description: The Aqara mini switch device
      selector:
        device:
          filter:
            - integration: mqtt
    press_single:
      name: Single button press
      default: []
      selector:
        action: {}
    press_double:
      name: Double button press
      default: []
      selector:
        action: {}
    hold:
      name: Hold button
      default: []
      selector:
        action: {}
    release:
      name: Release button
      default: []
      selector:
        action: {}
mode: queued
max_exceeded: silent
triggers:
  - trigger: device
    device_id: !input switch
    domain: mqtt
    type: action
    subtype: single
    id: single
  - trigger: device
    device_id: !input switch
    domain: mqtt
    type: action
    subtype: double
    id: double
  - trigger: device
    device_id: !input switch
    domain: mqtt
    type: action
    subtype: hold
    id: hold
  - trigger: device
    device_id: !input switch
    domain: mqtt
    type: action
    subtype: release
    id: release
actions:
  - choose:
      - conditions: "{{ trigger.id == 'single' }}"
        sequence: !input press_single
      - conditions: "{{ trigger.id == 'double' }}"
        sequence: !input press_double
      - conditions: "{{ trigger.id == 'hold' }}"
        sequence: !input hold
      - conditions: "{{ trigger.id == 'release' }}"
        sequence: !input release
